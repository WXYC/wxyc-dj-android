org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 compiles Kotlin itself (android.builtInKotlin defaults true) and then
# REFUSES the org.jetbrains.kotlin.android plugin outright
# (https://issuetracker.google.com/438678642). Opting out keeps the Kotlin
# Gradle Plugin in charge, which is what the rest of this build assumes:
# :api is a pure-JVM module on org.jetbrains.kotlin.jvm (it has no AGP to
# supply a Kotlin compiler at all), and kotlin { jvmToolchain(17) } in both
# modules is KGP DSL. Adopting built-in Kotlin means porting both modules and
# the compose/serialization compiler plugins onto AGP's DSL -- a migration in
# its own right, not a version bump.
android.builtInKotlin=false

# AGP 9 also ships a new Android DSL by default, whose ApplicationExtension no
# longer extends the BaseExtension that Kotlin 2.2.20's KGP casts to when it
# applies org.jetbrains.kotlin.android (ClassCastException at plugin-apply
# time). Both this flag and android.builtInKotlin above are transitional --
# AGP removes them in 10.0 -- and both are a consequence of one thing: KGP
# 2.2.20 predates AGP 9. The exit is a Kotlin bump, not a rewrite of
# these build files.
android.newDsl=false
