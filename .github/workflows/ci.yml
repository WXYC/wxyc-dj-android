name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job executes arbitrary code from the PR head — Gradle build scripts,
# annotation processors, and third-party dependencies — so it must never see a
# writable token. Read-only contents is all a test job needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :api:test is named explicitly rather than relying on `check`, because
      # this repo's whole structural bet is that the :api suites run on the host
      # in milliseconds. If they ever stop running, that has to be a visible
      # deletion from this file, not a silent consequence of a task-graph change.
      - name: Run :api unit tests
        run: ./gradlew :api:test

      - name: Run :app unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      # Lint's textReport prints findings to this log, but the HTML/XML detail
      # (and the JUnit XML with real stack traces on a test failure) exists only
      # on the runner — upload it or lose it.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            api/build/reports/
            api/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A SEPARATE job, not another step on test-and-lint: booting an emulator
  # costs minutes that unit-test feedback should never wait behind, and the two
  # fail for unrelated reasons. They run concurrently.
  #
  # Why this tier exists at all: everything above runs on the host JVM, and the
  # host JVM lies about Android. Robolectric's SdkSandboxClassLoader sandboxes
  # only `android.*` and cannot define classes in `java.*`, so
  # BinCollationParityTest — written specifically to check Android's
  # `java.text.Collator` — was silently exercising the desktop JDK's instead.
  # It passed. `Collator.FULL_DECOMPOSITION` reached `main` behind it as an
  # unconditional crash on the first Bin-tab load of every real phone. Nothing
  # in the host tiers could have caught that, and every PR from the :app shell
  # onward depends on runtime behavior of exactly that kind.
  instrumented:
    name: instrumented (API 30 ATD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest exposes /dev/kvm but not to the unprivileged runner user,
      # and without hardware acceleration the emulator is too slow to finish
      # inside any sane timeout.
      - name: Grant the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AGP downloads the ATD system image itself, and refuses to install a
      # package whose license is unaccepted. `|| true` hides nothing: if the
      # acceptance really failed, the setup task below fails loudly and names
      # the exact package. It is here because `yes` takes a SIGPIPE the moment
      # sdkmanager stops reading.
      - name: Accept the Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Locate the SDK's system-image directory
        run: echo "ANDROID_SYSTEM_IMAGES=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/system-images" >> "$GITHUB_ENV"

      # Only the system image, deliberately not the AVD: the image is a large
      # immutable download worth carrying between runs, while a cached AVD
      # carries lock files and snapshots whose staleness is its own flake
      # source. Recreating the AVD from a warm image is seconds. Bump the key's
      # suffix when the managed device in app/build.gradle.kts changes, or the
      # cache will serve an image for the previous API level forever.
      - name: Cache the ATD system image
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SYSTEM_IMAGES }}
          key: android-system-image-aosp_atd-30-${{ runner.os }}

      - name: Run instrumented tests
        run: ./gradlew :app:atdApi30DebugAndroidTest

      # AGP skips the task silently when the androidTest source set is empty,
      # so a green emulator job is not by itself evidence that anything ran.
      - name: Assert the instrumented run was not empty
        run: python3 .github/scripts/assert_instrumented_tests_ran.py

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
